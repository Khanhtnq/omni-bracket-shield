[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 256
seed = "0x5318007"

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"
